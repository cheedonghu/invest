<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>股票资产负债表</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <a class="site-brand" href="/"
          >投资研究手记<span>INVESTMENT NOTES</span></a
        >
        <nav class="top-nav" aria-label="主导航">
          <a class="nav-link" href="/">估值分析</a>
          <a class="nav-link active" href="/balance-sheet" aria-current="page"
            >资产负债表</a
          >
          <a class="nav-link" href="/valuation">资产估值</a>
          <a class="nav-link" href="/marked-stocks">股票标记</a>
        </nav>
      </header>

      <section class="hero-card">
        <div>
          <p class="eyebrow">公司研究 / 季度财报</p>
          <h1>资产负债表</h1>
          <p class="hero-copy">
            输入任意 6 位 A
            股代码，获取季度资产负债表，并按固定分类归并为资产与负债柱状图。
            未单列科目按报表小计归入其他项目；缺少流动性分类或尚未识别的金额单列为未分类项，合计以原始报表为准。
          </p>
        </div>
        <div class="stat-grid">
          <article class="stat-card">
            <span>当前股票</span>
            <strong id="balance-stock-name">-</strong>
          </article>
          <article class="stat-card">
            <span>当前季度</span>
            <strong id="balance-report-date">-</strong>
          </article>
          <article class="stat-card">
            <span>资产合计</span>
            <strong id="balance-assets-total">-</strong>
          </article>
          <article class="stat-card">
            <span>负债合计</span>
            <strong id="balance-liabilities-total">-</strong>
          </article>
        </div>
      </section>

      <section class="panel-card">
        <div class="panel-header panel-controls">
          <div>
            <h2 id="balance-chart-title">资产负债表</h2>
            <p>以亿元为单位展示季度资产负债结构。</p>
          </div>
          <form id="balance-form" class="stock-form">
            <label class="stock-input-group" for="balance-symbol">
              <span>股票代码</span>
              <input
                id="balance-symbol"
                name="symbol"
                type="text"
                inputmode="numeric"
                maxlength="6"
                placeholder="例如 600519"
                value="600519"
              />
            </label>
            <label class="stock-input-group" for="balance-years">
              <span>近几年</span>
              <input
                id="balance-years"
                name="years"
                type="text"
                inputmode="numeric"
                maxlength="2"
                placeholder="例如 3"
                value="3"
              />
            </label>
            <button id="balance-submit-btn" type="submit">查询数据</button>
          </form>
        </div>

        <div class="period-toolbar">
          <button id="prev-period-btn" type="button">上一季</button>
          <button id="current-period-btn" type="button">最新数据</button>
          <button id="next-period-btn" type="button">下一季</button>
        </div>

        <div id="balance-chart" class="chart"></div>
      </section>
    </main>

    <script src="/assets/paper-theme.js?v=native-hover-3"></script>
    <script src="/assets/balance-sheet.js?v=native-hover-3"></script>
  </body>
</html>
